spring.application.name=pastelaria-cwb
server.port=8080

# ===== Banco de dados: MySQL =====
# O banco "pastelaria_cwb" é criado automaticamente se não existir.
# Ajuste usuário e senha conforme o seu MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/pastelaria_cwb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Datas no formato "2026-10-07" no JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.profiles.active=h2